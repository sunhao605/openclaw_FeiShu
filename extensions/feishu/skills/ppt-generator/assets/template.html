<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>演示文稿</title>

    <!-- External dependencies: remove for confidential or offline presentations. -->
    <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/tailwindcss/3.0.23/tailwind.min.js"></script>
    <link
      href="https://fonts.loli.net/css2?family=Inter:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Noto Sans SC", Inter, system-ui, sans-serif;
        background: #000;
        color: #fff;
        overflow: hidden;
      }

      .slides-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
      }

      .slide {
        width: 100%;
        height: 100%;
        max-width: 450px;
        max-height: 800px;
        aspect-ratio: 9 / 16;
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        opacity: 0;
        transform: translateX(100%);
        transition:
          opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        background: linear-gradient(180deg, #0a0a0a 0%, #000 100%);
      }

      .slide.active {
        opacity: 1;
        transform: translateX(0);
      }

      .slide.prev {
        opacity: 0;
        transform: translateX(-100%);
      }

      .light-spot {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.3;
        pointer-events: none;
      }

      .light-spot-1 {
        width: 300px;
        height: 300px;
        background: #3b82f6;
        top: -100px;
        right: -100px;
        animation: float1 20s ease-in-out infinite;
      }

      .light-spot-2 {
        width: 250px;
        height: 250px;
        background: #8b5cf6;
        bottom: -80px;
        left: -80px;
        animation: float2 25s ease-in-out infinite;
      }

      .light-spot-3 {
        width: 200px;
        height: 200px;
        background: #06b6d4;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: float3 18s ease-in-out infinite;
      }

      @keyframes float1 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        25% {
          transform: translate(-50px, 30px);
        }
        50% {
          transform: translate(30px, 50px);
        }
        75% {
          transform: translate(50px, -20px);
        }
      }

      @keyframes float2 {
        0%,
        100% {
          transform: translate(0, 0);
        }
        33% {
          transform: translate(40px, -40px);
        }
        66% {
          transform: translate(-30px, 30px);
        }
      }

      @keyframes float3 {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.2);
        }
      }

      .slide-content {
        position: relative;
        z-index: 10;
        text-align: center;
        width: 100%;
      }

      .progress-bar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 100;
      }

      .progress-dot {
        width: 8px;
        height: 8px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition:
          background 0.3s,
          transform 0.3s;
      }

      .progress-dot.active {
        background: #fff;
        transform: scale(1.3);
      }

      .progress-dot:hover {
        background: rgba(255, 255, 255, 0.6);
      }

      .page-number {
        position: fixed;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.4);
        z-index: 100;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="slides-container">
      <section class="slide active">
        <div class="light-spot light-spot-1"></div>
        <div class="light-spot light-spot-2"></div>
        <div class="slide-content">
          <h1 class="text-5xl font-black mb-6 leading-tight">主标题</h1>
          <p class="text-xl font-light text-gray-400">副标题</p>
        </div>
      </section>

      <section class="slide">
        <div class="light-spot light-spot-2"></div>
        <div class="light-spot light-spot-3"></div>
        <div class="slide-content">
          <h1 class="text-4xl font-black leading-tight">冲击力标题<br />第二行</h1>
        </div>
      </section>

      <section class="slide">
        <div class="light-spot light-spot-1"></div>
        <div class="light-spot light-spot-3"></div>
        <div class="slide-content">
          <span class="text-6xl text-gray-600 block mb-2">&quot;</span>
          <p class="text-2xl font-bold mb-6">金句内容</p>
          <span class="text-lg font-light text-gray-500">— 来源</span>
        </div>
      </section>

      <section class="slide">
        <div class="light-spot light-spot-1"></div>
        <div class="light-spot light-spot-2"></div>
        <div class="light-spot light-spot-3"></div>
        <div class="slide-content">
          <h1 class="text-3xl font-bold mb-8">总结金句</h1>
          <p class="text-xl font-light text-gray-400">行动号召</p>
        </div>
      </section>
    </main>

    <nav class="progress-bar" id="progressBar" aria-label="幻灯片导航"></nav>
    <div class="page-number" id="pageNumber" aria-live="polite">1 / 4</div>

    <script>
      const slides = document.querySelectorAll(".slide");
      const progressBar = document.getElementById("progressBar");
      const pageNumber = document.getElementById("pageNumber");
      let currentSlide = 0;

      function updateSlides() {
        slides.forEach((slide, index) => {
          slide.classList.remove("active", "prev");
          if (index === currentSlide) {
            slide.classList.add("active");
          } else if (index < currentSlide) {
            slide.classList.add("prev");
          }
        });

        document.querySelectorAll(".progress-dot").forEach((dot, index) => {
          dot.classList.toggle("active", index === currentSlide);
          dot.setAttribute("aria-current", index === currentSlide ? "page" : "false");
        });

        pageNumber.textContent = `${currentSlide + 1} / ${slides.length}`;
      }

      function goToSlide(index) {
        currentSlide = Math.max(0, Math.min(index, slides.length - 1));
        updateSlides();
      }

      function nextSlide() {
        goToSlide(currentSlide + 1);
      }

      function previousSlide() {
        goToSlide(currentSlide - 1);
      }

      slides.forEach((_, index) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = `progress-dot ${index === 0 ? "active" : ""}`;
        dot.setAttribute("aria-label", `转到第 ${index + 1} 页`);
        dot.addEventListener("click", () => goToSlide(index));
        progressBar.appendChild(dot);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowRight" || event.key === " ") {
          nextSlide();
        } else if (event.key === "ArrowLeft") {
          previousSlide();
        }
      });

      let touchStartX = 0;
      document.addEventListener("touchstart", (event) => {
        touchStartX = event.touches[0].clientX;
      });
      document.addEventListener("touchend", (event) => {
        const difference = touchStartX - event.changedTouches[0].clientX;
        if (Math.abs(difference) > 50) {
          if (difference > 0) {
            nextSlide();
          } else {
            previousSlide();
          }
        }
      });
    </script>
  </body>
</html>
